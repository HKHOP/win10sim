<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Disk Cleanup. The real cleanmgr icon is a hard drive with a broom, and
       neither half of that is in the extracted set: assets/win10-shell-icons/
       holds Imageres.dll + Shell32.dll, and every icon in it was rendered and
       looked at - there is no broom anywhere, and the Segoe MDL2 Assets font
       has no broom codepoint either (see js/global/constants.js). So the drive
       and the broom here are both drawn, which is the one honest option left.
       Two-tone on purpose: the drives are silver and the broom is the shell
       blue, so the mark reads on the light Start list and on the blue tile. -->
  <defs>
    <linearGradient id="dcBody" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fdfefe"/>
      <stop offset="0.5" stop-color="#e3e7ec"/>
      <stop offset="1" stop-color="#b8bfc9"/>
    </linearGradient>
    <linearGradient id="dcBroom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa3ef"/>
      <stop offset="1" stop-color="#0b5fa5"/>
    </linearGradient>
    <clipPath id="dcClip">
      <rect x="4" y="14" width="30" height="32" rx="3.5"/>
    </clipPath>
  </defs>

  <!-- The drive -->
  <rect x="4" y="14" width="30" height="32" rx="3.5" fill="url(#dcBody)"/>
  <g clip-path="url(#dcClip)">
    <rect x="4" y="14" width="30" height="8" fill="#ffffff" opacity="0.6"/>
    <rect x="4" y="35.5" width="30" height="1.4" fill="#949ba6"/>
    <rect x="4" y="36.9" width="30" height="10" fill="#aab1bb"/>
  </g>
  <rect x="4" y="14" width="30" height="32" rx="3.5" fill="none" stroke="#8b929c" stroke-width="1.2"/>
  <circle cx="9.6" cy="18.4" r="2" fill="#78d64b" stroke="#4ea62a" stroke-width="0.6"/>
  <circle cx="9" cy="17.8" r="0.7" fill="#ffffff" opacity="0.9"/>
  <rect x="24" y="16.6" width="7.6" height="1.4" rx="0.7" fill="#c8ced6"/>
  <rect x="24" y="19.6" width="7.6" height="1.4" rx="0.7" fill="#c8ced6"/>

  <!-- The broom, sweeping across the drive's corner -->
  <g transform="translate(44,44) rotate(35)">
    <rect x="-2.3" y="-27" width="4.6" height="28" rx="2.3" fill="url(#dcBroom)"/>
    <rect x="-2.3" y="-27" width="1.7" height="28" rx="0.85" fill="#ffffff" opacity="0.35"/>
    <path d="M-9.5 0.5 h19 a2.5 2.5 0 0 1 2.5 2.5 v3.5 h-24 v-3.5 a2.5 2.5 0 0 1 2.5 -2.5 z" fill="url(#dcBroom)"/>
    <path d="M-12 7.5 h24 l-2.2 8.5 h-19.6 z" fill="#8ec9f7"/>
    <g stroke="#2f89d7" stroke-width="1" stroke-linecap="round">
      <path d="M-8.2 8.6 l-0.9 6.4"/>
      <path d="M-4.4 8.6 l-0.5 6.9"/>
      <path d="M0.6 8.6 l0 6.9"/>
      <path d="M4.4 8.6 l0.5 6.9"/>
      <path d="M8.2 8.6 l0.9 6.4"/>
    </g>
  </g>

  <!-- Cleaned-up sparkle -->
  <path d="M56 8.5 l1.8 4.7 l4.7 1.8 l-4.7 1.8 l-1.8 4.7 l-1.8 -4.7 l-4.7 -1.8 l4.7 -1.8 z"
        fill="#ffffff" stroke="#1f7fd0" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M45.5 3.5 l1.1 2.9 l2.9 1.1 l-2.9 1.1 l-1.1 2.9 l-1.1 -2.9 l-2.9 -1.1 l2.9 -1.1 z"
        fill="#ffffff" stroke="#1f7fd0" stroke-width="0.8" stroke-linejoin="round"/>
</svg>
